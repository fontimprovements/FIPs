name: Check FIP Compliance

on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]
    paths:
      - 'FIP*/**'

jobs:
  check-fip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed FIP folders
        id: changed-fips
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -oE '^FIP[0-9]+/' | sort -u || true)
          echo "Changed FIP folders:"
          echo "$CHANGED"
          echo "folders<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check FIP markdown file exists
        run: |
          ERROR=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            folder="${folder%/}"
            fip_file="${folder}/${folder}.md"
            if [ ! -f "$fip_file" ]; then
              echo "::error title=Missing markdown file::${fip_file} is required but does not exist"
              ERROR=1
            else
              echo "✓ ${fip_file} exists"
            fi
          done <<< "${{ steps.changed-fips.outputs.folders }}"
          exit $ERROR

      - name: Install dependencies
        run: pip install pyyaml --quiet

      - name: Write fip.yaml validation script
        run: |
          cat > /tmp/validate_fip_yaml.py << 'PYEOF'
import sys, yaml

yaml_file = sys.argv[1]

try:
    with open(yaml_file) as f:
        data = yaml.safe_load(f)
except Exception as e:
    print(f'::error file={yaml_file}::Failed to parse {yaml_file}: {e}')
    sys.exit(1)

if not isinstance(data, dict):
    print(f'::error file={yaml_file}::fip.yaml must contain a mapping (key-value pairs)')
    sys.exit(1)

errors = False

if 'name' not in data:
    print(f'::error file={yaml_file}::Field "name" is required')
    errors = True
elif not isinstance(data['name'], str) or not data['name'].strip():
    print(f'::error file={yaml_file}::Field "name" must be a non-empty string')
    errors = True

if 'keywords' not in data:
    print(f'::error file={yaml_file}::Field "keywords" is required')
    errors = True
elif not isinstance(data['keywords'], list):
    print(f'::error file={yaml_file}::Field "keywords" must be a list')
    errors = True
elif len(data['keywords']) == 0:
    print(f'::error file={yaml_file}::"keywords" list must not be empty')
    errors = True
else:
    for i, kw in enumerate(data['keywords'], start=1):
        if not isinstance(kw, str):
            print(f'::error file={yaml_file},line={i}::Keyword at position {i} must be a string')
            errors = True
        else:
            if kw != kw.lower():
                print(f'::error file={yaml_file},line={i}::Keyword "{kw}" must be all lowercase')
                errors = True
            if any(c in kw for c in (' ', '\t')):
                print(f'::error file={yaml_file},line={i}::Keyword "{kw}" contains spaces or tabs')
                errors = True

sys.exit(1 if errors else 0)
PYEOF

      - name: Validate fip.yaml
        run: |
          ERROR=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            folder="${folder%/}"
            yaml_file="${folder}/fip.yaml"

            if [ ! -f "$yaml_file" ]; then
              echo "::error title=Missing fip.yaml::${yaml_file} is required but does not exist"
              ERROR=1
              continue
            fi

            echo "✓ ${yaml_file} exists"
            python3 /tmp/validate_fip_yaml.py "$yaml_file" || ERROR=1
          done <<< "${{ steps.changed-fips.outputs.folders }}"
          exit $ERROR